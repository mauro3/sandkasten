name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.12 is the oldest supported version (see AGENTS.md).
        python-version: ["3.12", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests -v
      - name: Compile
        run: python3 -m py_compile sandkasten sandkasten3 sandkasten-cleanup
      - name: Help output
        run: ./sandkasten --help && ./sandkasten3 --help
